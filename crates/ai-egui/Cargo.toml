[package]
name = "craft-ai-egui"
description = "Shared egui widgets for the Craft AI layer: connection status and model picker, consent prompt, job progress with cancel."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
repository.workspace = true
publish = false

[dependencies]
craft-ai-model.workspace = true
craft-ai-client = { path = "../ai-client" }
egui = "0.36"

[dev-dependencies]
egui_kittest = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
craft-ai-native = { path = "../ai-native", package = "craft-ai-native" }
craft-ai-features = { path = "../ai-features", package = "craft-ai-features" }
tempfile = "3"
serde_json.workspace = true

[lints]
workspace = true
