[package]
name = "craft-ai-comfy-env"
description = "Finds an existing ComfyUI install, inventories its models and node packs, and downloads missing model files safely. Native only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
craft-ai-core.workspace = true
craft-ai-http.workspace = true
craft-ai-features = { path = "../ai-features", package = "craft-ai-features" }
craft-ai-media = { path = "../ai-media", package = "craft-ai-media" }
serde.workspace = true
serde_json.workspace = true
percent-encoding = "2"
flate2 = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
dirs = "7"
url = "2"
fs4 = { version = "1", default-features = false, features = ["sync"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "ppmd", "util"] }
tempfile = "3"

[dev-dependencies]
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "util"] }
flate2 = "1"
tempfile = "3"
sha2 = "0.11"

[lints]
workspace = true
