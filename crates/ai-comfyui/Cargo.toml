[package]
name = "craft-ai-comfyui"
description = "ComfyUI workflow adapter and SAM 3 point, text and session clients for Craft AI. Local only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
craft-ai-core.workspace = true
craft-ai-http.workspace = true
craft-ai-media = { path = "../ai-media", package = "craft-ai-media" }
serde.workspace = true
serde_json.workspace = true
png = "0.17"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tempfile = "3"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native shared workflow-library location; the model crate remains wasm-safe.
craft-ai-native = { path = "../ai-native", package = "craft-ai-native" }

[dev-dependencies]
tempfile = "3"
png = "0.17"
base64 = "0.22"
